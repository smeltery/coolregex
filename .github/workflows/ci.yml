name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2
        with:
          version: 1.18.2
      - name: Install dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Install diagram browser
        run: flox activate -- bun x puppeteer browsers install chrome
      - name: Validate source and documentation
        run: flox activate -- bun run check
      - name: Build production application
        run: flox activate -- bun run build
